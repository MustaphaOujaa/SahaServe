version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sahaserve-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - AI_SERVICE_URL=http://review-analysis:5000/api/analyze-reviews
      - DISH_ASSISTANT_URL=http://smart-order-assistance:5005/assistant/chat
      - REVERB_APP_ID=sahaserve-local
      - REVERB_APP_KEY=sahaserve-local-key
      - REVERB_APP_SECRET=sahaserve-local-secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - BROADCAST_CONNECTION=reverb
      - QUEUE_CONNECTION=database
      - FRONTEND_URL=http://${APP_DOMAIN:-88.96.37.179}
      - MAIL_MAILER=smtp
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=younesabourrig1ya@gmail.com
      - "MAIL_PASSWORD=rqai yvqp jjie aiwb"
      - MAIL_ENCRYPTION=tls
      - MAIL_FROM_ADDRESS=younesabourrig1ya@gmail.com
      - MAIL_FROM_NAME=SahaServe
    volumes:
      - sqlite_data:/var/www/html/database
      - storage_data:/var/www/html/storage

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sahaserve-reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - REVERB_APP_ID=sahaserve-local
      - REVERB_APP_KEY=sahaserve-local-key
      - REVERB_APP_SECRET=sahaserve-local-secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
    volumes:
      - sqlite_data:/var/www/html/database
      - storage_data:/var/www/html/storage
    depends_on:
      - backend

  review-analysis:
    build:
      context: ./ai-services/review-analysis
      dockerfile: Dockerfile
    container_name: sahaserve-review-analysis
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1

  smart-order-assistance:
    build:
      context: ./ai-services/smart-order-assistance
      dockerfile: Dockerfile
    container_name: sahaserve-smart-order
    ports:
      - "5005:5005"
    environment:
      - PYTHONUNBUFFERED=1
      - LARAVEL_API_URL=http://backend:80/api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://${APP_DOMAIN:-88.96.37.179}:8000/api
        - VITE_REVERB_APP_KEY=sahaserve-local-key
        - VITE_REVERB_HOST=${APP_DOMAIN:-88.96.37.179}
        - VITE_REVERB_PORT=8080
        - VITE_REVERB_SCHEME=http
    container_name: sahaserve-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - reverb

volumes:
  sqlite_data:
  storage_data:
